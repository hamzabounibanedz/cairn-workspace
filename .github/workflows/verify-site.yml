name: Verify portfolio site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      AUTH_SECRET: "ci-build-placeholder-not-a-real-secret"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the application
        run: |
          npm ci
          npx --no-install prisma migrate deploy
          npm run build
          npm start >/tmp/site.log 2>&1 &
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsSL http://localhost:3000 -o /tmp/home || { tail -40 /tmp/site.log; exit 1; }
          grep -Fq "Cairn Workspace" /tmp/home
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsSL http://localhost:3000/ -o /tmp/portfolio-home.html
          npm install --prefix "$RUNNER_TEMP/site-check" --no-audit --no-fund playwright-core@1.65.1
          cat > "$RUNNER_TEMP/site-check/check.cjs" <<'JS'
          const { chromium } = require("playwright-core");
          (async () => {
            const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true });
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on("pageerror", err => errors.push(err.message));
              for (const width of [1440, 390]) {
                await page.setViewportSize({ width, height: 900 });
                await page.goto("http://localhost:3000/", { waitUntil: "domcontentloaded" });
                await page.locator("body").waitFor();
                if (!(await page.title()).includes("Cairn Workspace") && !(await page.locator("body").innerText()).includes("Cairn Workspace")) throw Error("Missing site identity");
                await page.screenshot({ path: process.env.RUNNER_TEMP + "/site-" + width + ".png", animations: "disabled" });
              }
              if (errors.length) throw Error(errors.join("\n"));
            } finally { await browser.close(); }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          JS
          node "$RUNNER_TEMP/site-check/check.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: site-previews
          path: ${{ runner.temp }}/site-*.png
          retention-days: 14
